name: Prebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-linux-gnu
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
            target: aarch64-linux-gnu
          - os: macos-14
            platform: darwin
            arch: x64
            target: x86_64-macos
          - os: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-macos
          - os: windows-2022
            platform: win32
            arch: x64
            target: x86_64-windows
          - os: windows-2022
            platform: win32
            arch: arm64
            target: aarch64-windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npx marmotta build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/*
  merge:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds
